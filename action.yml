name: 'AI PR Summary'
description: 'Auto-generate PR descriptions from diffs using Claude or OpenAI'
author: 'Mansi2221'

branding:
  icon: 'file-text'
  color: 'blue'

inputs:
  provider:
    description: 'AI provider to use (anthropic or openai)'
    required: false
    default: 'anthropic'
  api-key:
    description: 'API key for the AI provider'
    required: true
  model:
    description: 'Model to use'
    required: false
    default: 'claude-sonnet-4-20250514'
  max-diff-size:
    description: 'Maximum diff size in characters to send to the model'
    required: false
    default: '12000'
  github-token:
    description: 'GitHub token for updating PR description'
    required: false
    default: ${{ github.token }}
  template:
    description: 'Custom prompt template. Use {diff} and {title} placeholders.'
    required: false
    default: ''

outputs:
  summary:
    description: 'The generated PR summary'

runs:
  using: 'node20'
  main: 'dist/index.js'
